# TripTastic Render Blueprint
# Deploys ONLY the backend to Render.
# The frontend is deployed separately to Vercel.
# Learn more: https://render.com/docs/blueprints

services:
  # ── Backend Web Service ─────────────────────────────────────────────────────
  - type: web
    name: triptastic-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # PORT is automatically set by Render — do NOT hardcode it here

      # MySQL Database Configuration (Required — use PlanetScale / Railway / Aiven)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false

      # CORS — set to your Vercel production URL
      # All *.vercel.app preview URLs are automatically allowed.
      - key: FRONTEND_URL
        sync: false

      # Google Gemini AI (Secret — set in Render dashboard)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TIMEOUT_MS
        value: "45000"

      # Places API Key (Secret — set in Render dashboard)
      - key: GEOAPIFY_API_KEY
        sync: false

      # Optional API Keys
      - key: PEXELS_API_KEY
        sync: false
      - key: CURRENCY_API_KEY
        sync: false
      - key: CURRENCY_BASE
        value: INR
